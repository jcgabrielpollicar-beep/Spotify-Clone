{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<form class="form" method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="actions">
    <button class="btn" type="submit">Save</button>
    <a class="btn secondary" href="javascript:history.back()">Cancel</a>
  </div>
</form>
{% endblock %}
